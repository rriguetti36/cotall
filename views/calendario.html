<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Calendario</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }

    #calendar {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;

<body>
  aqui si existe un html
  <div id="calendar"></div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.4.0/build/ical.min.js"></script>

  <script>
    window.addEventListener("message", async function (event) {
      const icalUrl = event.data && event.data.icalUrl;
      console.log(icalUrl);
      if (!icalUrl) return;
      const myProxyUrl = "https://cotall-edbb51592c54.herokuapp.com/proxy-ics?url=" + encodeURIComponent(icalUrl);

      try {
        console.log(1);
        const response = await fetch(myProxyUrl, {
          'mode': 'cors',
          'method': 'GET',
          'headers': {
            'Access-Control-Allow-Origin': '*',
          }
        });
        console.log(2);
        const icalText = await response.text();
        console.log(3);
        const jcalData = ICAL.parse(icalText);
        console.log(4);
        const comp = new ICAL.Component(jcalData);
        console.log(5);
        const events = comp.getAllSubcomponents("vevent");

        const calendarEvents = events.map(event => {
          const e = new ICAL.Event(event);
          return {
            title: e.summary,
            start: e.startDate.toJSDate(),
            end: e.endDate.toJSDate()
          };
        });

        const calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
          initialView: 'dayGridMonth',
          events: calendarEvents,
          height: "auto"
        });

        calendar.render();
      } catch (err) {
        document.body.innerHTML = "<p>Error cargando calendario. Verifica que el enlace sea válido.</p>";
        console.error("❌ Error al cargar el .ics:", err);
      }
    });
  </script>
</body>

</html>
